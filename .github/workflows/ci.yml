name: CI Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: finalproject

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t finalproject ./FinalProject

      - name: Tag Docker Image
        run: |
          docker tag finalproject:latest 306767070773.dkr.ecr.eu-north-1.amazonaws.com/finalproject:latest

      - name: Push Docker Image
        run: |
          docker push 306767070773.dkr.ecr.eu-north-1.amazonaws.com/finalproject:latest